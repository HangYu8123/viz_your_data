<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>viz_results feedback</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#1c2330; --muted:#5d6675; --line:#dfe3e8; --accent:#0072B2; --ok:#009E73; --warn:#D55E00; --soft:#eef3f8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181f; --panel:#1c222b; --ink:#e8ecf1; --muted:#9aa5b3; --line:#2c3540; --soft:#232b36; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line); padding:10px 24px; display:flex; align-items:center; gap:16px; }
  header h1 { font-size:16px; margin:0; } header .st { color:var(--muted); font-size:12.5px; flex:1; }
  main { max-width:1100px; margin:0 auto; padding:20px 24px 80px; }
  .fig { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 20px; margin-bottom:16px; display:grid; grid-template-columns: 1fr 340px; gap:18px; }
  @media (max-width: 900px) { .fig { grid-template-columns: 1fr; } }
  .fig img { max-width:100%; border:1px solid var(--line); background:#fff; border-radius:6px; }
  .fig h3 { margin:0 0 6px; font-size:14px; font-family: ui-monospace, Menlo, monospace; }
  .rate { display:flex; gap:6px; margin:6px 0 10px; }
  .rate button { width:38px; height:34px; border:1px solid var(--line); background:var(--bg); border-radius:6px; font:inherit; cursor:pointer; }
  .rate button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .act { display:flex; gap:6px; margin-bottom:10px; }
  .act button { flex:1; border:1px solid var(--line); background:var(--bg); border-radius:6px; padding:6px; font:inherit; cursor:pointer; }
  .act button.on.accept { background:var(--ok); color:#fff; border-color:var(--ok); }
  .act button.on.revise { background:#E69F00; color:#fff; border-color:#E69F00; }
  .act button.on.reject { background:var(--warn); color:#fff; border-color:var(--warn); }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  textarea { width:100%; min-height:70px; border:1px solid var(--line); border-radius:6px; padding:7px 9px; font:inherit; background:var(--bg); color:var(--ink); resize:vertical; }
  .overall { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 20px; }
  button.primary { background:var(--accent); color:#fff; border:1px solid var(--accent); border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; }
  .status { font-size:12.5px; margin-top:8px; min-height:18px; } .status.ok { color:var(--ok); } .status.err { color:var(--warn); }
  .hint { color:var(--muted); font-size:12.5px; }
</style>
</head>
<body>
<header><h1>Rate the figures</h1><div class="st" id="st">loading…</div><button class="primary" id="submitTop">Submit feedback</button></header>
<main>
  <p class="hint">1 = unusable, 5 = ready for the paper. <b>accept</b> = keep as is · <b>revise</b> = keep the idea, change something (say what) · <b>reject</b> = different figure needed. Everything you write goes into <code>viz/trajectory/</code> and improves the next run.</p>
  <div id="figs"></div>
  <div class="overall">
    <label>Overall comments (what worked, what to change next time, venue constraints)</label>
    <textarea id="overall"></textarea>
    <div style="margin-top:10px"><button class="primary" id="submit">Submit feedback</button></div>
    <div class="status" id="status"></div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const state = {};
async function load() {
  const r = await (await fetch("/api/figures")).json();
  $("#st").textContent = `${r.figures.length} figures in ${r.dir} · run ${r.run || "(no active run — start one with trajectory.py start)"}`;
  const box = $("#figs"); box.innerHTML = "";
  for (const f of r.figures) {
    state[f.id] = { rating: 0, action: "", comment: "" };
    const d = document.createElement("div"); d.className = "fig"; d.dataset.id = f.id;
    d.innerHTML = `<div><h3>${f.id}</h3><img src="${f.url}" alt="${f.id}"></div>
      <div>
        <label>Rating</label><div class="rate">${[1,2,3,4,5].map(n => `<button data-r="${n}">${n}</button>`).join("")}</div>
        <label>Action</label><div class="act"><button class="accept" data-a="accept">accept</button><button class="revise" data-a="revise">revise</button><button class="reject" data-a="reject">reject</button></div>
        <label>Comment (what to change, what you liked)</label><textarea></textarea>
      </div>`;
    d.querySelectorAll(".rate button").forEach(b => b.onclick = () => { state[f.id].rating = +b.dataset.r; d.querySelectorAll(".rate button").forEach(x => x.classList.toggle("on", +x.dataset.r <= +b.dataset.r)); });
    d.querySelectorAll(".act button").forEach(b => b.onclick = () => { state[f.id].action = b.dataset.a; d.querySelectorAll(".act button").forEach(x => x.classList.toggle("on", x === b)); });
    d.querySelector("textarea").oninput = e => state[f.id].comment = e.target.value;
    box.appendChild(d);
  }
}
async function submit() {
  const items = Object.entries(state).filter(([, v]) => v.rating || v.action || v.comment).map(([id, v]) => ({ figure: id, rating: v.rating || null, action: v.action || (v.rating >= 4 ? "accept" : "revise"), comment: v.comment }));
  const r = await (await fetch("/api/feedback", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ items, overall: $("#overall").value }) })).json();
  const s = $("#status");
  if (r.error) { s.className = "status err"; s.textContent = r.error; }
  else { s.className = "status ok"; s.textContent = `recorded ${r.recorded} entries in ${r.run}. Tell the agent "feedback submitted".`; }
}
$("#submit").onclick = submit; $("#submitTop").onclick = submit;
load().catch(e => { $("#st").textContent = "failed: " + e.message; });
</script>
</body>
</html>
